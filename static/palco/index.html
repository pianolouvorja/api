<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="manifest" href="./manifest.webmanifest"><title>LouvorJA Palco Receiver</title>
<style>html,body{margin:0;width:100%;height:100%;background:#05070c;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#splash{position:fixed;inset:0;z-index:20;background:#05070c;transition:opacity .55s}#splash img{width:100%;height:100%;object-fit:cover}#setup{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:linear-gradient(145deg,rgba(5,7,12,.9),rgba(5,7,12,.72)),url('./splash-palco.jpg') center/cover}#setup h1{font-size:clamp(24px,3vw,34px);margin:0;color:#fcce02}.brand-mark{display:grid;justify-items:center;gap:8px;margin-bottom:16px}.brand-mark img{max-width:min(44vw,180px);max-height:100px;object-fit:contain}.brand-name{font-weight:700;letter-spacing:.2em;font-size:14px;color:#fcce02}.brand-bars{display:flex;width:min(40vw,220px);height:5px;gap:3px}.brand-bars i{flex:1}.brand-bars i:nth-child(1){background:#04549b}.brand-bars i:nth-child(2){background:#00c1e6}.brand-bars i:nth-child(3){background:#fcce02}input,button{font:inherit;padding:12px 16px;border-radius:8px;border:0}input{text-align:center;text-transform:uppercase;letter-spacing:4px}button{background:#fcce02;color:#111;font-weight:700;cursor:pointer}.hidden{display:none!important}#stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#05070c;background-size:cover;background-position:center}#idleBrand{display:grid;justify-items:center;gap:18px;opacity:.94}#idleBrand img{width:min(38vw,250px);max-height:30vh;object-fit:contain}#idleBrand .brand-name{font-size:clamp(16px,2vw,24px)}#text{font-size:clamp(28px,5vw,78px);font-weight:700;max-width:92%;text-shadow:0 3px 10px #000;white-space:pre-wrap}.idle{opacity:.72;font-size:clamp(16px,2vw,28px);margin-top:20px}#footer{position:absolute;bottom:3%;font-size:clamp(16px,2vw,30px);opacity:.9}#screenInfo{position:absolute;top:14px;left:18px;z-index:8;max-width:45vw;color:#fff;background:rgba(0,0,0,.3);border:0;padding:6px 9px;border-radius:5px;font-size:12px;opacity:.62;cursor:pointer;text-align:left}#newScreen{position:absolute;top:10px;right:14px;z-index:8;margin:0;background:rgba(0,0,0,.3);color:#fcce02;border:1px solid rgba(252,206,2,.45);padding:8px 12px;border-radius:6px;font-size:13px;font-weight:700;opacity:.85}#newScreen:hover{opacity:1;background:rgba(252,206,2,.12)}.status{font-size:14px;color:#d3d8e2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#78808d;margin-right:6px}.on{background:#24d36b}.connected{position:absolute;top:14px;right:18px;font-size:12px;opacity:.58;letter-spacing:.08em}#install.stage-float{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);z-index:9;opacity:.92}</style></head>
<body><div id="splash"><img src="./splash-palco.jpg" alt="Palco LouvorJA"></div><section id="setup"><div class="brand-mark"><img src="./logo-louvor-ja.svg" alt="Louvor JA"><img src="./logo-piano-louvorja.png" alt="PIANO"><div class="brand-bars"><i></i><i></i><i></i></div></div><h1>Conectar monitor</h1><div><input id="code" maxlength="6" placeholder="CÓDIGO" autocomplete="off"><button id="connect">Conectar</button></div><div class="status"><i id="dot" class="dot"></i><span id="status">Informe o código da sessão</span></div><button id="install" class="hidden" style="margin:0 auto;background:#222;color:#fcce02;border:1px solid #fcce02">⬇ Instalar app (tela cheia)</button></section><main id="stage" class="hidden"><div id="idleBrand"><img src="./logo-piano-louvorja.png" alt="PIANO"><div class="brand-name">LOUVOR JA · PALCO</div><div class="brand-bars"><i></i><i></i><i></i></div></div><div id="text" class="idle">Aguardando conteúdo…</div><div id="footer"></div><button id="screenInfo" type="button" title="Clique para detectar esta tela">Detectar esta tela</button><button id="newScreen" type="button" title="Abre outra janela do Palco para o próximo monitor">＋ Nova tela</button><small id="connected" class="connected"></small></main>
<script>
setTimeout(()=>{const s=$('splash');if(!s)return;s.style.opacity='0';setTimeout(()=>s.remove(),600)},1600);
const PALCO_API_WS=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/v1/palco';
const params=new URLSearchParams(location.search);const api=(params.get('api')||PALCO_API_WS).replace(/\/$/,'');
const $=id=>document.getElementById(id);let ws=null,code=(params.get('code')||localStorage.getItem('louvorja.palco.code')||'').toUpperCase(),retry=1000,manual=false;
$('code').value=code;
// Identifica a tela física desta instância. A permissão só pode ser pedida
// por clique, por isso o botão fica discreto no canto do receiver.
async function detectCurrentScreen(){const out=$('screenInfo');if(!window.getScreenDetails){out.textContent='Tela: detecção indisponível neste navegador';return}try{const d=await window.getScreenDetails();const s=d.currentScreen||d.screens.find(x=>x.isPrimary)||window.screen;const label=s.label||'Monitor atual';out.textContent=`${label} · ${s.width}×${s.height}${s.isPrimary?' · Principal':''}`}catch{out.textContent='Tela: permissão não concedida'}}
$('screenInfo').onclick=detectCurrentScreen;
// "+ Nova tela": janela nova do receiver, mesma sessão. Popup remanescente
// (small) já maximizada — usuário só arrasta pro próximo monitor. Um clique.
$('newScreen').onclick=()=>{window.open(location.href,'_blank','popup=yes,width=screen.availWidth,height=screen.availHeight')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
// Instalação PWA: captura o prompt do Chrome e oferece botão explícito.
// O Chrome só emite beforeinstallprompt quando QUALIFICA (HTTPS+manifest+SW);
// o clique no botão satisfaz o requisito de gesto do usuário.
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('install').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{installEvt=null;$('install').classList.add('hidden');try{localStorage.setItem('louvorja.palco.installed','1')}catch{}});
// Instalado? esconde pra sempre. Conectado sem instalar? botão continua
// visível por 30s no stage (fullscreen real precisa de app instalado).
try{if(localStorage.getItem('louvorja.palco.installed')==='1')installEvt=null}catch{}
$('install').onclick=async()=>{if(!installEvt){setStatus('Instalação indisponível aqui: use ⋮ → "Instalar página como app" (ou "Salvar e compartilhar" → Instalar)',false);return}installEvt.prompt();const{outcome}=await installEvt.userChoice;installEvt=null;$('install').classList.add('hidden');if(outcome!=='accepted')setStatus('instalação cancelada')};
// No stage: mostra o botão flutuante por 30s após conectar (tempo pra instalar).
function showInstallOnStage(){try{if(localStorage.getItem('louvorja.palco.installed')==='1')return}catch{}document.body.appendChild($('install'));$('install').classList.add('stage-float');$('install').classList.remove('hidden');clearTimeout(showInstallOnStage._t);showInstallOnStage._t=setTimeout(()=>$('install').classList.add('hidden'),60000)}
function setStatus(s,on=false){$('status').textContent=s;$('dot').classList.toggle('on',on)}
function applyStage(m){const s=$('stage'),text=$('text'),footer=$('footer');const vw=n=>typeof n==='number'?(n/19.2)+'vw':'';text.style.fontSize=vw(m.fontSize)||'';text.style.fontWeight=m.fontWeight||'';text.style.color=m.textColor||'#fff';text.style.textAlign=m.textAlign||'center';text.style.textTransform=m.textTransform||'none';text.style.textShadow=m.textShadow===false?'none':`0 ${vw(m.shadowBlur)||'3px'} ${vw((m.shadowBlur||2)*3)||'10px'} rgba(0,0,0,${m.shadowIntensity??.8})`;text.style.background=m.textBox?'rgba(0,0,0,'+(m.boxOpacity??.45)+')':'transparent';text.style.border=m.textBox&&m.boxBorder?'1px solid rgba(255,255,255,.25)':'0';text.style.padding=m.textBox?'0.35em 0.55em':'';text.style.borderRadius=m.textBox?'clamp(14px,2.4vmin,32px) 0 clamp(14px,2.4vmin,32px) 0':'';footer.style.color=m.footerRefColor||m.footerColor||'#fff';footer.style.fontWeight=m.footerWeight||'';footer.style.textAlign=m.textAlign||'center';s.style.justifyContent=({top:'flex-start',bottom:'flex-end'}[m.textVerticalAlign]||'center');s.style.backgroundColor=m.backgroundColor||'#000';s.style.backgroundImage=m.background?'url("'+String(m.background).replace(/"/g,'%22')+'")':'none'}
function render(m){if(m.v!==1&&m.v!==2)return;const idle=$('idleBrand');switch(m.type){case "projection":idle.classList.add('hidden');applyStage(m);$('text').className='';$('text').innerHTML=m.text||'';$('footer').textContent=m.footerRef||m.footer||'';break;case'idle':idle.classList.remove('hidden');$('text').className='idle';$('text').textContent=m.msg||'Aguardando conteúdo…';$('footer').textContent='';break;case'timer':idle.classList.add('hidden');applyStage(m);$('text').className='';$('text').textContent=m.text||m.value||'';break;case'youare':$('connected').textContent=m.label||('Monitor '+(m.slot??''));break;case'audio':case'video':console.debug('cloud receiver media not implemented',m.type);break}}
async function connect(){manual=true;code=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');$('code').value=code;if(code.length!==6){setStatus('Código inválido — use 6 caracteres');return}localStorage.setItem('louvorja.palco.code',code);if(ws)ws.close();setStatus('buscando sessão…');try{const base=api.replace(/^ws/,'http');const r=await fetch(base+`/sessions/${code}/token`);if(!r.ok)throw Error('sessão não encontrada');const {token}=await r.json();open(token)}catch(e){setStatus(e.message);schedule()}}
function open(token){setStatus('conectando…');ws=new WebSocket(api+'/relay/'+code+'?token='+encodeURIComponent(token)+'&role=receiver');ws.onopen=()=>{retry=1000;manual=false;setStatus('conectado',true);$('setup').classList.add('hidden');$('stage').classList.remove('hidden');$('connected').textContent=code;showInstallOnStage()};ws.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};ws.onclose=e=>{if(e.code===4404){setStatus('sessão inválida');return}setStatus('desconectado — reconectando…');schedule()};ws.onerror=()=>setStatus('erro de conexão')}
function schedule(){if(manual)return;setTimeout(()=>{if(code)connect()},retry);retry=Math.min(retry*2,10000)}
// Fullscreen no primeiro gesto: Chromium só aceita requestFullscreen dentro
// de um clique/tecla NESTA janela. Um toque em qualquer lugar da projeção
// resolve; depois disso fica fullscreen até fechar a aba (Esc sai).
function goFullscreen(){const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(document.fullscreenElement)return;if(fn)try{fn.call(el).catch(()=>{})}catch{try{el.webkitRequestFullscreen&&el.webkitRequestFullscreen()}catch{}}}
document.addEventListener('click',goFullscreen,{once:false});
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')goFullscreen()});
$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));$('connect').onclick=connect;$('code').onkeydown=e=>{if(e.key==='Enter')connect()};window.addEventListener('pagehide',()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.close(1000,'receiver_closed')},{once:true});if(code)connect();
function handle(m){render(m)}
</script></body></html>
