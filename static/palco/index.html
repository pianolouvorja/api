<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="manifest" href="./manifest.webmanifest"><title>LouvorJA Palco Receiver</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#setup{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center}#setup h1{font-size:28px}input,button{font:inherit;padding:12px 16px;border-radius:8px;border:0}input{text-align:center;text-transform:uppercase;letter-spacing:4px}button{background:#f5c400;color:#111;font-weight:700;cursor:pointer}.hidden{display:none!important}#stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background-size:cover;background-position:center}#text{font-size:clamp(28px,5vw,78px);font-weight:700;max-width:92%;text-shadow:0 3px 10px #000;white-space:pre-wrap}.idle{opacity:.7;font-size:24px}#footer{position:absolute;bottom:3%;font-size:clamp(16px,2vw,30px);opacity:.9}.status{font-size:14px;color:#aaa}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:6px}.on{background:#24d36b}.connected{position:absolute;top:14px;right:18px;font-size:12px;opacity:.45}</style></head>
<body><section id="setup"><h1>Palco LouvorJA</h1><div><input id="code" maxlength="6" placeholder="CÓDIGO" autocomplete="off"><button id="connect">Conectar</button></div><div class="status"><i id="dot" class="dot"></i><span id="status">Informe o código da sessão</span></div></section><main id="stage" class="hidden"><div id="text" class="idle">Aguardando conteúdo…</div><div id="footer"></div><small id="connected" class="connected"></small></main>
<script>
const PALCO_API_WS=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/v1/palco';
const params=new URLSearchParams(location.search);const api=(params.get('api')||PALCO_API_WS).replace(/\/$/,'');
const $=id=>document.getElementById(id);let ws=null,code=localStorage.getItem('louvorja.palco.code')||'',retry=1000,manual=false;
$('code').value=code;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
function setStatus(s,on=false){$('status').textContent=s;$('dot').classList.toggle('on',on)}
function render(m){if(m.v!==1&&m.v!==2)return;switch(m.type){case "projection":$('text').className='';$('text').innerHTML=m.text||'';$('footer').textContent=m.footerRef||m.footer||'';if(m.background)$('stage').style.backgroundImage='url('+m.background+')';break;case'idle':$('text').className='idle';$('text').textContent=m.msg||'Aguardando conteúdo…';$('footer').textContent='';break;case'timer':$('text').className='';$('text').textContent=m.text||m.value||'';break;case'youare':$('connected').textContent=m.label||('TV '+(m.slot??''));break;case'audio':case'video':console.debug('cloud receiver media not implemented',m.type);break}}
async function connect(){manual=true;code=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');$('code').value=code;if(code.length!==6){setStatus('Código inválido — use 6 caracteres');return}localStorage.setItem('louvorja.palco.code',code);if(ws)ws.close();setStatus('buscando sessão…');try{const base=api.replace(/^ws/,'http');const r=await fetch(base+`/sessions/${code}/token`);if(!r.ok)throw Error('sessão não encontrada');const {token}=await r.json();open(token)}catch(e){setStatus(e.message);schedule()}}
function open(token){setStatus('conectando…');ws=new WebSocket(api+'/relay/'+code+'?token='+encodeURIComponent(token)+'&role=receiver');ws.onopen=()=>{retry=1000;manual=false;setStatus('conectado',true);$('setup').classList.add('hidden');$('stage').classList.remove('hidden');$('connected').textContent=code};ws.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};ws.onclose=e=>{if(e.code===4404){setStatus('sessão inválida');return}setStatus('desconectado — reconectando…');schedule()};ws.onerror=()=>setStatus('erro de conexão')}
function schedule(){if(manual)return;setTimeout(()=>{if(code)connect()},retry);retry=Math.min(retry*2,10000)}
$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));$('connect').onclick=connect;$('code').onkeydown=e=>{if(e.key==='Enter')connect()};if(code)connect();
function handle(m){render(m)}
</script></body></html>
